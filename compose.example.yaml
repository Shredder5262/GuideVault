services:
  guidevault:
    image: ghcr.io/YOUR-GITHUB-NAME/guidevault:latest
    container_name: guidevault
    restart: unless-stopped
    ports:
      - "5478:5478"
    environment:
      - ASPNETCORE_URLS=http://+:5478
      - PAGEQUEST__DATA__ROOT=/data
      - PAGEQUEST__UPDATES__CHANNEL=stable
      - PAGEQUEST__UPDATES__STABLEFEEDURL=https://example.com/updates/guidevault-stable.json
      - PAGEQUEST__UPDATES__CURRENTIMAGE=ghcr.io/YOUR-GITHUB-NAME/guidevault:latest
    volumes:
      - ./data:/data
      - /path/to/manuals:/books:ro
