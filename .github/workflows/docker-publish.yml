name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Docker version tag, for example 1.1.0"
        required: true
        type: string
      publish_latest:
        description: "Also publish the latest tag"
        required: true
        default: true
        type: boolean

  push:
    tags:
      - "v*.*.*"

env:
  IMAGE_NAME: ghcr.io/shredder5262/guidevault

jobs:
  publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker tags
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi

          TAGS="${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:v${VERSION}"

          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.publish_latest }}" == "true" ]]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.title=GuideVault
            org.opencontainers.image.description=GuideVault manual, guide, and magazine library server
